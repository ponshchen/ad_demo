<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>content-gallery h5 template</title>
    <style>
      * {
        margin: 0;
      }

      #ad-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        z-index: 9999;
        /* display: flex;
        align-items: center; */
        background: #000000ba;
      }

      #close {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 48px;
        height: 48px;
      }

      #item {
        position: absolute;
        width: 180px;
        height: auto;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      #video {
        width: 100%;
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      @keyframes flash {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }

      #finger {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 180px;
        height: 180px;
        animation: flash 1s linear;
        animation-iteration-count: infinite;
      }
    </style>
  </head>
  <body>
    <div id="container" style="display: none">
      <img src="./images/background0.png" style="width: 100vw" />
      <img src="./images/background1.png" style="width: 100vw" />
      <div id="ad-wrapper">
        <img src="./images/close.png" alt="" id="close" onclick="closeAd()" />
        <img src="./images/548/item.gif" alt="" id="item" />
        <canvas id="cover"></canvas>
        <video muted loop playsinline id="video" onclick="openUrl()">
          <source src="./images/548/video.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
        <img src="./images/548/finger.png" alt="" id="finger" />
      </div>
      <img src="./images/background2.png" style="width: 100vw" />
    </div>
  </body>
  <script>
    const width = window.innerWidth;
    const height = window.innerHeight;
    let mousedown = false;
    let hasDone = false;
    const finger = document.getElementById("finger");
    const ad = document.getElementById("ad-wrapper");
    const cover = document.getElementById("cover");
    const coverCtx = cover.getContext("2d");
    const item = document.getElementById("item");
    const video = document.getElementById("video");

    initial();

    function start() {
      ad.addEventListener("mousedown", eventDown);
      ad.addEventListener("mouseup", eventUp);
      document.addEventListener("mouseup", () => (mousedown = false));
      ad.addEventListener("mousemove", eventMove);
      ad.addEventListener("touchstart", eventDown);
      ad.addEventListener("touchend", eventUp);
      document.addEventListener("touchend", () => (mousedown = false));
      ad.addEventListener("touchmove", eventMove);
    }

    function initial() {
      var imgs = document.images,
        len = imgs.length,
        counter = 0;

      [].forEach.call(imgs, function (img) {
        if (img.complete) incrementCounter();
        else img.addEventListener("load", incrementCounter, false);
      });

      function incrementCounter() {
        counter++;
        if (counter === len) {
          const container = document.getElementById("container");
          container.style.display = "block";
          cover.width = width;
          cover.height = height;
          const image = new Image();
          image.src = "./images/548/cover.png";
          image.crossOrigin = "Anonymous";
          image.addEventListener("load", () => {
            coverCtx.drawImage(image, 0, 0, width, height);
            coverCtx.globalCompositeOperation = "destination-out";
            cover.style.background = "url(./images/548/background.png)";
            cover.style.backgroundSize = "cover";
          });
          start();
        }
      }
    }

    function eventDown(ev) {
      if (ev.target.id === "close") return;
      ev.preventDefault();
      mousedown = true;
      finger.remove();
    }

    function eventUp(ev) {
      if (ev.target.id === "close") return;
      ev.preventDefault();
      mousedown = false;
    }

    function eventMove(ev) {
      if (!mousedown) return;
      ev.preventDefault();
      if (ev.changedTouches) {
        ev = ev.changedTouches[ev.changedTouches.length - 1];
      }
      var rect = ad.getBoundingClientRect();
      var x = ev.clientX - rect.left;
      var y = ev.clientY - rect.top;
      coverCtx.beginPath();
      coverCtx.arc(x, y, 30, 0, Math.PI * 2);
      coverCtx.fill();

      item.style.left = `${x}px`;
      item.style.top = `${y}px`;

      handleFilledPercentage(getFilledPercentage());
    }

    function getFilledPercentage() {
      let imgData = coverCtx.getImageData(0, 0, width, height);
      let pixels = imgData.data;
      let transPixels = [];
      for (let i = 0; i < pixels.length; i += 4) {
        if (pixels[i + 3] < 128) {
          transPixels.push(pixels[i + 3]);
        }
      }
      return (
        ((transPixels.length / (pixels.length / 4)) * 100).toFixed(2) + "%"
      );
    }

    function handleFilledPercentage(percentage) {
      percentage = percentage || 0;
      // 設定多少 % 的畫面被噴漆就下一 cut
      if (parseInt(percentage) > 32) {
        coverCtx.clearRect(0, 0, width, height);
        hasDone = true;
        item.remove();
        cover.remove();
        video.style.display = "block";
        video.play();
        ad.removeEventListener("mousedown", eventDown);
        ad.removeEventListener("mouseup", eventUp);
        document.removeEventListener("mouseup", () => (mousedown = false));
        ad.removeEventListener("mousemove", eventMove);
        ad.removeEventListener("touchstart", eventDown);
        ad.removeEventListener("touchend", eventUp);
        document.removeEventListener("touchend", () => (mousedown = false));
        ad.removeEventListener("touchmove", eventMove);
      }
    }

    function openUrl() {
      window.open("https://www.monkeyshoulder.com");
    }

    function closeAd() {
      ad.remove();
    }
  </script>
</html>
